[project]
name = "implanttrace"
version = "1.0.0"
description = "Shop-floor traceability system for a precision implant machining plant"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Header", "fastapi.Query", "app.deps.page_roles", "app.deps.require_roles",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # generated by Alembic
