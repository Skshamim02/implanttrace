name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: implanttrace
          POSTGRES_PASSWORD: implanttrace
          POSTGRES_DB: implanttrace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U implanttrace"
          --health-interval 5s --health-retries 10
    env:
      PG_URL: postgresql+psycopg://implanttrace:implanttrace@localhost:5432/implanttrace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite (includes migration check)
        run: pytest -q
      - name: Tests on PostgreSQL
        run: TEST_DATABASE_URL=$PG_URL pytest -q
      - name: Migrations apply on PostgreSQL and the audit trigger works
        run: |
          DATABASE_URL=$PG_URL python - <<'EOF'
          from sqlalchemy import create_engine, text
          from app.migrate import upgrade
          import os
          url = os.environ["DATABASE_URL"]
          eng = create_engine(url)
          with eng.begin() as c:
              c.execute(text("DROP SCHEMA public CASCADE; CREATE SCHEMA public"))
          upgrade(url)
          with eng.begin() as c:
              c.execute(text("INSERT INTO audit_log (at, changed_by, action, table_name, record_id) "
                             "VALUES (now(), 'ci', 'CREATE', 'x', 1)"))
          try:
              with eng.begin() as c:
                  c.execute(text("UPDATE audit_log SET reason = 'tamper'"))
              raise SystemExit("audit_log UPDATE should have been blocked")
          except Exception as exc:
              assert "append-only" in str(exc), exc
              print("audit_log trigger OK")
          EOF
      - name: Seed demo data on PostgreSQL
        run: DATABASE_URL=$PG_URL python -m scripts.seed

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t implanttrace:ci .
      - name: Container starts and becomes ready
        run: |
          docker run -d --name it -p 8000:8000 \
            -e SECRET_KEY=ci-secret-ci-secret-ci-secret-ci-secret-12 -e COOKIE_SECURE=true \
            -e DATABASE_URL=sqlite:////tmp/ci.db implanttrace:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/ready && exit 0; sleep 1; done
          docker logs it; exit 1
